apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"


react {
  

    /* Autolinking */
    autolinkLibrariesWithApp()
}


def enableProguardInReleaseBuilds = false


def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

def revopushKey = { String environment ->
    def name = "REVOPUSH_ANDROID_${environment}_KEY"
    def value = project.findProperty(name) ?: System.getenv(name) ?: "YOUR_ANDROID_${environment}_DEPLOYMENT_KEY"
   
    return "\"${value}\"".toString()
}

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.petfriendly"
    defaultConfig {
        applicationId "com.petfriendly"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
      
            resValue "string", "CodePushDeploymentKey", '""'
        }
        release {
          
            signingConfig signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        
            resValue "string", "CodePushDeploymentKey", revopushKey("PRODUCTION")
        }
  
        releaseStaging {
            initWith release
            resValue "string", "CodePushDeploymentKey", revopushKey("STAGING")
            // React Native's Gradle plugin only fills this manifest value in for debug and release.
            // A staging build is a release build, so no cleartext (http) traffic.
            manifestPlaceholders["usesCleartextTraffic"] = "false"
         
            matchingFallbacks = ['release']
        }
    }
}

dependencies {
  
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

apply from: "../../node_modules/react-native-vector-icons/fonts.gradle"
apply from: "../../node_modules/@revopush/react-native-code-push/android/codepush.gradle"
